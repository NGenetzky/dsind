name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the built image to the registry'
        type: boolean
        default: true

env:
  # Flexible registry destination. Defaults to GitHub Container Registry,
  # but can be pointed elsewhere by changing these values (or by adding
  # REGISTRY/IMAGE_NAME repository variables).
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # All of the build/tag/push logic lives in hooks/docker-publish so
      # that it can be run and debugged locally with `docker` as well as
      # from this workflow.
      - name: Build and publish Docker image
        run: ./hooks/docker-publish
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_INPUT: ${{ inputs.push }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
